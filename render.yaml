services:
  - type: web
    name: flatsnfood-backend
    env: node
    buildCommand: npm install
    startCommand: npm run start:backend
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=400